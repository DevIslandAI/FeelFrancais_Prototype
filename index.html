<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yukta's final prototype</title>
<link rel="stylesheet" href="commun/vendor/maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css">
<style>
  :root {
    --ia: #6f42c1; --ia-fonce: #4f2d93; --ia-clair: #f4f0fc; --ia-bord: #d9ccf3;
    --texte: #22313a; --gris: #66757f; --gris-clair: #8a97a1; --bord: #e3e8ec; --fond: #f6f7f9; --panneau: #fff;
    --side: #1e2a30; --side-texte: #d7e0e5; --side-gris: #8fa1ab; --side-hover: #273740; --side-actif: #33254f;
    --or: #e0a526;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 14px/1.5 "Segoe UI", Catamaran, Arial, sans-serif; overflow: hidden; }
  button { font: inherit; }
  a { color: var(--ia); }

  /* ── La plateforme en plein ecran ── */
  .plein { position: fixed; inset: 0; background: #fff; }
  .plein iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* ── (ancienne mise en page, plus utilisee) ── */
  .app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100vh; transition: grid-template-columns .15s; }
  .app.replie { grid-template-columns: 60px minmax(0, 1fr); }

  /* ── Sidebar (blanche, repliable en une colonne de numeros) ── */
  .side { background: #fff; color: var(--texte); border-right: 1px solid var(--bord); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .side-tete { display: flex; align-items: center; gap: 8px; padding: 14px 12px 12px 16px; border-bottom: 1px solid var(--bord); }
  .side-tete .textes { flex: 1; min-width: 0; }
  .side-tete .marque { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ia); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-tete h1 { margin: 1px 0 0; font-size: 16px; white-space: nowrap; }
  .plier { flex: none; width: 30px; height: 30px; border: 1px solid var(--bord); background: #fff; border-radius: 6px; color: var(--gris); cursor: pointer; }
  .plier:hover { border-color: var(--ia); color: var(--ia); }
  .side-liste { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 8px 16px; }
  .groupe { margin: 14px 8px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--gris-clair); line-height: 1.35; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
  .item:hover { background: #f3f4f6; }
  .item.actif { background: var(--ia-clair); box-shadow: inset 3px 0 0 var(--ia); }
  .item .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: #eef0f3; color: var(--gris); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .item.actif .n { background: var(--ia); color: #fff; }
  .item .t { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.actif .t { color: var(--ia-fonce); }
  .item.final { margin-top: 2px; border: 1px solid #f0dca8; background: #fffaf0; }
  .item.final:hover { background: #fdf3dc; }
  .item.final.actif { background: #fdf0d2; box-shadow: inset 3px 0 0 var(--or); }
  .item.final .n { background: var(--or); color: #fff; }
  .item.final .t { color: #7a5a0c; }
  .item .n .fa { font-size: 12px; }
  /* Place en bas pour le bouton flottant « Ajouter un commentaire » */
  .side-pied { border-top: 1px solid var(--bord); padding: 10px 16px 72px; font-size: 12px; color: var(--gris); }
  .side-pied button { background: #fff; border: 1px solid var(--bord); color: var(--texte); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .side-pied button:hover { border-color: var(--ia); color: var(--ia); }
  .fictif { display: flex; gap: 6px; align-items: center; color: #b3261e; margin-bottom: 8px; white-space: nowrap; }
  /* Repliee : seuls les numeros restent, le titre s'affiche au survol */
  .app.replie .side-tete { padding: 14px 0 12px; justify-content: center; }
  .app.replie .side-tete .textes, .app.replie .item .t, .app.replie .side-pied .libelle { display: none; }
  .app.replie .side-liste { padding: 6px 6px 16px; }
  .app.replie .item { justify-content: center; padding: 6px 0; }
  .app.replie .groupe { display: block; height: 1px; margin: 8px 6px; background: var(--bord); font-size: 0; }
  .app.replie .side-pied { padding: 10px 6px 72px; text-align: center; }
  .app.replie .fictif { justify-content: center; }

  /* ── Main ── */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .barre { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panneau); border-bottom: 1px solid var(--bord); flex-wrap: wrap; }
  .icone-btn { border: 1px solid var(--bord); background: #fff; border-radius: 6px; width: 34px; height: 34px; cursor: pointer; color: var(--gris); flex: none; }
  .icone-btn:hover { border-color: var(--ia); color: var(--ia); }
  .titre { min-width: 0; flex: 1; }
  .titre h2 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .titre h2 .pastille { font-size: 11px; font-weight: 700; color: var(--ia); background: var(--ia-clair); border-radius: 10px; padding: 1px 8px; }
  .titre h2 .pastille.or { color: #7a5a0c; background: #fbf1d8; }
  .titre p { margin: 2px 0 0; font-size: 12.5px; color: var(--gris); }
  .onglets { display: flex; gap: 4px; background: #f0f2f4; padding: 3px; border-radius: 8px; }
  .onglets button { border: 0; background: none; border-radius: 6px; padding: 5px 12px; cursor: pointer; color: var(--gris); font-weight: 600; font-size: 13px; }
  .onglets button small { display: block; font-weight: 400; font-size: 10.5px; color: var(--gris-clair); line-height: 1.1; }
  .onglets button.actif { background: #fff; color: var(--texte); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .cadre { flex: 1; min-height: 0; position: relative; background: #fff; }
  .cadre iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* ── Page d'accueil ── */
  .apercu { flex: 1; overflow-y: auto; background: linear-gradient(180deg, #f7f3ff 0, #f6f7f9 340px); }
  .apercu-in { max-width: 980px; margin: 0 auto; padding: 44px 28px 120px; }
  .hero { text-align: center; max-width: 680px; margin: 0 auto 40px; }
  .hero-tag { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ia); background: #fff;
    border: 1px solid var(--ia-bord); border-radius: 20px; padding: 3px 12px; }
  .hero h2 { font-size: 32px; line-height: 1.2; margin: 14px 0 10px; letter-spacing: -.01em; }
  .hero p { font-size: 16px; color: var(--gris); margin: 0 0 22px; }
  .hero-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .bouton { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--ia); color: #fff; font-weight: 700; padding: 11px 20px; border-radius: 10px;
    cursor: pointer; box-shadow: 0 4px 14px rgba(111, 66, 193, .28); }
  .bouton:hover { background: var(--ia-fonce); }
  .bouton .fa-star { color: #ffd66b; }
  .bouton-2 { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--bord); background: #fff; color: var(--texte); font-weight: 600; padding: 11px 18px;
    border-radius: 10px; cursor: pointer; }
  .bouton-2:hover { border-color: var(--ia); color: var(--ia); }
  .note-fictif { display: inline-flex; align-items: center; gap: 6px; color: #a3302a; font-size: 12.5px; font-weight: 600; }
  .bloc { margin-top: 40px; }
  .bloc > h3 { font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--gris-clair); margin: 0 0 14px; text-align: center; }
  /* Comment faire : 3 etapes */
  .etapes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .etape { background: #fff; border: 1px solid var(--bord); border-radius: 14px; padding: 18px; display: flex; gap: 14px; align-items: flex-start; }
  .etape .rond { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--ia-clair); color: var(--ia); display: grid; place-items: center; font-size: 16px; }
  .etape b { display: block; font-size: 15px; margin-bottom: 2px; }
  .etape .quoi { color: var(--gris); font-size: 13.5px; }
  .ia-tag { display: inline-block; background: #fff; border: 1px solid #b499ee; color: var(--ia); border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 700; }
  /* Les dossiers de demo */
  .dossiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .dossier { background: #fff; border: 1px solid var(--bord); border-radius: 14px; padding: 18px; text-align: left; cursor: pointer; font: inherit; color: inherit;
    display: flex; flex-direction: column; gap: 12px; transition: border-color .12s, box-shadow .12s; }
  .dossier:hover { border-color: var(--ia-bord); box-shadow: 0 6px 18px rgba(40, 20, 90, .08); }
  .dossier-tete { display: flex; align-items: center; gap: 12px; }
  .avatar { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; }
  .dossier-tete b { display: block; font-size: 15px; }
  .dossier-tete small { color: var(--gris); font-size: 12.5px; }
  .cas { align-self: flex-start; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 2px 9px; }
  .puces { display: flex; flex-wrap: wrap; gap: 6px; }
  .puces span { font-size: 12px; background: #f3f4f6; color: #45545e; border-radius: 6px; padding: 3px 8px; }
  .dossier .ouvrir { margin-top: auto; font-size: 12.5px; font-weight: 600; color: var(--ia); }
  /* L'evolution : un fil de 5 etapes */
  .fil { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; position: relative; }
  .fil::before { content: ""; position: absolute; left: 8%; right: 8%; top: 17px; height: 2px; background: var(--ia-bord); }
  .tour { position: relative; text-align: center; }
  .tour .pastille-tour { position: relative; display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 2px solid var(--ia);
    color: var(--ia); font-weight: 700; margin-bottom: 10px; }
  .tour.final .pastille-tour { background: var(--or); border-color: var(--or); color: #fff; }
  .tour-carte { background: #fff; border: 1px solid var(--bord); border-radius: 12px; padding: 12px 10px; }
  .tour.final .tour-carte { border-color: #f0dca8; background: #fffaf0; }
  .tour-carte b { display: block; font-size: 13.5px; margin-bottom: 2px; }
  .tour-carte p { margin: 0 0 8px; font-size: 12px; color: var(--gris); line-height: 1.4; }
  .protos { display: flex; flex-direction: column; gap: 4px; }
  .protos button { border: 0; background: #f6f7f9; border-radius: 6px; padding: 4px 8px; font-size: 12.5px; text-align: left; cursor: pointer; color: var(--texte); }
  .protos button:hover { background: var(--ia-clair); color: var(--ia-fonce); }
  .protos button i { color: var(--gris-clair); font-style: normal; font-weight: 700; margin-right: 4px; }
  .tour.final .protos button { background: var(--or); color: #fff; font-weight: 700; text-align: center; }
  .tour.final .protos button:hover { background: #c98f14; }
  .comparer { text-align: center; margin-top: 30px; font-size: 13px; color: var(--gris); }
  .comparer button { border: 0; background: none; color: var(--ia); font-weight: 600; cursor: pointer; padding: 0; }

  /* ── Notes de revue (fenetre flottante) ── */
  .notes { position: fixed; right: 16px; bottom: 16px; z-index: 50; font-size: 13px; }
  .notes.discret .notes-pastille { display: none; }
  .notes-pied .fictif-pied { color: #b3261e; white-space: nowrap; }
  .notes-pastille { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--ia); color: #fff; font-weight: 700; padding: 10px 16px;
    border-radius: 24px; cursor: pointer; box-shadow: 0 6px 20px rgba(40, 20, 90, .35); }
  .notes-pastille:hover { background: var(--ia-fonce); }
  .notes-pastille .compte { background: #fff; color: var(--ia); border-radius: 10px; padding: 0 7px; font-size: 12px; }
  .notes-panneau { width: min(380px, calc(100vw - 32px)); height: min(560px, calc(100vh - 32px)); background: #fff; border: 1px solid var(--bord); border-radius: 12px;
    box-shadow: 0 16px 48px rgba(20, 30, 40, .28); display: flex; flex-direction: column; overflow: hidden; }
  .notes-tete { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--ia); color: #fff; }
  .notes-tete b { flex: 1; font-size: 14px; }
  .notes-tete button { border: 0; background: rgba(255, 255, 255, .16); color: #fff; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; }
  .notes-tete button:hover { background: rgba(255, 255, 255, .3); }
  .notes-defile { flex: 1; overflow-y: auto; padding: 0 14px; }
  .notes-saisie { padding: 12px 14px; border-bottom: 1px solid var(--bord); }
  .notes-saisie textarea { width: 100%; min-height: 76px; border: 1px solid #d5dbe0; border-radius: 6px; padding: 8px 10px; font: inherit; color: var(--texte); resize: vertical; }
  .notes-saisie textarea:focus { outline: 2px solid var(--ia-bord); border-color: var(--ia); }
  .notes-pied button.lien { border: 0; background: none; padding: 0; color: var(--gris); text-decoration: underline; }
  .notes-bloc { padding: 12px 14px; border-bottom: 1px solid var(--bord); }
  .notes-bloc h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gris); }
  .notes-bloc h4 .sep { flex: 1; }
  .notes-bloc h4 small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--gris-clair); }
  .notes-bloc textarea { width: 100%; border: 1px solid #d5dbe0; border-radius: 6px; padding: 7px 9px; font: inherit; color: var(--texte); resize: vertical; }
  .notes-bloc textarea:focus { outline: 2px solid var(--ia-bord); border-color: var(--ia); }
  #notes-general { min-height: 90px; }
  #notes-texte { min-height: 64px; }
  .proto-courant { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 8px 10px; border-radius: 8px; background: var(--ia-clair); color: var(--ia-fonce); font-weight: 700; }
  .proto-courant .num { flex: none; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: var(--ia); color: #fff; display: grid; place-items: center; font-size: 12px; }
  .proto-courant.final { background: #fdf3dc; color: #7a5a0c; }
  .proto-courant.final .num { background: var(--or); }
  .proto-courant small { display: block; font-weight: 400; color: var(--gris); font-size: 11.5px; }
  .proto-aucun { color: var(--gris); font-size: 12.5px; background: #f6f7f9; border-radius: 8px; padding: 10px; }
  .notes-ligne { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .notes-ligne .aide { flex: 1; font-size: 11.5px; color: var(--gris-clair); }
  .notes-ajouter { border: 0; background: var(--ia); color: #fff; font-weight: 700; padding: 7px 14px; border-radius: 6px; cursor: pointer; }
  .notes-ajouter:hover { background: var(--ia-fonce); }
  .notes-ajouter:disabled { background: #c9bde6; cursor: default; }
  .filtre { display: flex; gap: 4px; background: #f0f2f4; padding: 3px; border-radius: 7px; margin: 0 0 4px; }
  .filtre button { flex: 1; border: 0; background: none; border-radius: 5px; padding: 4px 8px; cursor: pointer; color: var(--gris); font-size: 12px; font-weight: 600; }
  .filtre button.actif { background: #fff; color: var(--texte); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .notes-vide { color: var(--gris-clair); font-style: italic; padding: 10px 0; }
  .note { padding: 10px 0; border-bottom: 1px solid #f0f2f4; }
  .note:last-child { border-bottom: 0; }
  .note-meta { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--gris-clair); }
  .note-meta .ctx { background: var(--ia-clair); color: var(--ia); border-radius: 8px; padding: 0 7px; font-weight: 600; }
  .note-meta .sep { flex: 1; }
  .note-meta button { border: 0; background: none; color: var(--gris-clair); cursor: pointer; padding: 0 3px; }
  .note-meta button:hover { color: var(--ia); }
  .note-texte { white-space: pre-wrap; word-wrap: break-word; margin-top: 3px; }
  .note textarea { width: 100%; min-height: 70px; margin-top: 4px; border: 1px solid var(--ia); border-radius: 6px; padding: 6px 8px; font: inherit; }
  .note .actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
  .note .actions button { border: 1px solid var(--bord); background: #fff; border-radius: 5px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .note .actions button.ok { background: var(--ia); color: #fff; border-color: var(--ia); }
  .notes-pied { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-top: 1px solid var(--bord); background: #fafbfc; font-size: 11.5px; color: var(--gris); }
  .notes-pied .etat { flex: 1; }
  .note-meta .ctx { white-space: nowrap; }
  .notes-pied button { border: 1px solid var(--bord); background: #fff; border-radius: 5px; padding: 4px 9px; cursor: pointer; font-size: 12px; color: var(--texte); }
  .notes-pied button:hover { border-color: var(--ia); color: var(--ia); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #22313a; color: #fff; padding: 8px 14px; border-radius: 6px; z-index: 60; font-size: 13px; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app, .app.replie { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
    .side { max-height: 45vh; }
    /* Replie sur telephone : seule la ligne du titre (et son bouton) reste */
    .app.replie .side-liste, .app.replie .side-pied { display: none; }
    .app.replie .side-tete { justify-content: flex-start; padding: 10px 16px; }
    .app.replie .side-tete .textes { display: block; }
    .side-liste { padding-bottom: 12px; }
    .side-pied { padding-bottom: 10px; display: flex; gap: 12px; align-items: center; }
    .fictif { margin: 0; }
    .cadre { min-height: 80vh; }
    .etapes, .dossiers, .fil { grid-template-columns: 1fr; }
    .fil::before { display: none; }
    .hero h2 { font-size: 26px; }
    .notes { left: 12px; bottom: 12px; }
  }
</style>
</head>
<body>
<div class="plein"><iframe id="vue" title="Yukta's final prototype"></iframe></div>

<div class="notes" id="notes">
  <button type="button" class="notes-pastille" id="notes-ouvrir" aria-expanded="false"><i class="fa fa-comment-o"></i> Ajouter un commentaire <span class="compte" id="notes-compte">0</span></button>
  <div class="notes-panneau" id="notes-panneau" role="dialog" aria-label="Commentaires" hidden>
    <div class="notes-tete"><i class="fa fa-comment-o"></i><b>Vos commentaires</b>
      <button type="button" id="notes-fermer" title="Réduire"><i class="fa fa-minus"></i></button></div>
    <div class="notes-saisie">
      <textarea id="notes-texte" maxlength="5000" placeholder="Écrivez votre commentaire…"></textarea>
      <div class="notes-ligne"><span class="aide" id="notes-page"></span><button type="button" class="notes-ajouter" id="notes-ajouter" disabled>Ajouter</button></div>
    </div>
    <div class="notes-defile"><div id="notes-liste"></div></div>
    <div class="notes-pied">
      <button type="button" id="notes-copier" title="Copier tous les commentaires"><i class="fa fa-clone"></i> Copier</button>
      <button type="button" id="notes-telecharger" title="Télécharger tous les commentaires"><i class="fa fa-download"></i> Télécharger</button>
      <span class="etat"></span>
      <button type="button" id="reinitialiser" class="lien" title="Remet la démo à zéro (données fictives)"><i class="fa fa-undo"></i> Réinitialiser la démo</button></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── The prototypes ──────────────────────────────────────────────────────
  var TOURS = [
    { resume: 'La couche IA dans la page de Perle.', nav: 'Prototype', titre: 'Final', sous: '', ids: [13] }
  ];
  // Seul le prototype final est publie (05/10/2026) ; les remarques laissees sur les
  // anciens prototypes restent lisibles (leur libelle est garde dans la note).
  var P = {
    13: { t: 'Yukta\'s final prototype', d: 'Built on #11: one « Proposition IA » card everywhere, simple for Perle.', final: true,
      idee: 'One single « Proposition IA » card everywhere (Statut, Zone, Visa, section, document): a real title, its state (⏱ to decide / ✓ decided), then Accepter · Modifier · Refuser · Annuler. The window shows the section card on top (collapsible) and the documents as tabs: PDF on the left; on the right analysis, AI grade /20 with why, verdict, comment with the annotated PDF attached, internal note, previous versions.',
      voir: ['Awa → « Assurance santé »: a document in the wrong section, moved with Feel Français\'s own menu.',
        'Mariam → « Lettre de motivation »: the student\'s note and the AI\'s answer.',
        'Step bar above the documents: overall grade per step, what is still expected, optional documents.',
        'Notifications: analysis in progress / waiting / failed with « Relancer ».',
        'Every decided card shows who decided and when; « Copier » on every text.'] }
  };
  var PAGES = [
    { id: 'notifications', t: 'Notifications', s: 'file de travail' },
    { id: 'A', t: 'Awa Kouassi', s: 'cas complet' },
    { id: 'B', t: 'Lucas Ferreira', s: 'tout conforme' },
    { id: 'C', t: 'Mariam Diallo', s: '3e tentative' }
  ];
  var ORIGINE = { t: 'Pages d’origine, sans IA', d: 'Feel Français as it is today, for comparison.',
    idee: 'The same pages with no AI layer at all: exactly what Perle uses today.', voir: ['Compare with any prototype to see what was added.'] };

  function fichier(page) { return page === 'notifications' ? 'notifications.html' : 'profil-' + page + '.html'; }
  function dossierDe(n) { return n === 'base' ? 'base/' : 'variante-' + n + '/'; }
  function prefixe(n) { return P[n].lettre ? 'Variante ' + P[n].lettre + ' · ' : P[n].final ? '' : 'Prototype ' + n + ' · '; }
  function nomProto(n) { return n === 'base' ? ORIGINE.t : prefixe(n) + P[n].t; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }

  // ── La plateforme : une seule vue, qui s'ouvre sur les Notifications ──
  var etat = { proto: 13, page: null };
  function afficher(page) {
    etat.page = page;
    var url = dossierDe(13) + fichier(page);
    var vue = $('vue');
    if (vue.getAttribute('src') !== url) vue.setAttribute('src', url);
    history.replaceState(null, '', '#p13/' + page);
    document.title = (page === 'notifications' ? 'Notifications' : nomPage(page)) + ' · Yukta\'s final prototype';
    majContexte();
  }
  function lireHash() {
    var m = /^#p13\/(notifications|A|B|C)$/.exec(location.hash);
    afficher(m ? m[1] : 'notifications');
  }
  window.addEventListener('hashchange', lireHash);

  // Les liens de leur plateforme (liste des notifications, menu « Notification »)
  // changent la page affichee : on suit, pour l'adresse et pour les notes.
  // Quand une fenetre de leur plateforme est ouverte (apercu d'un document…), le
  // bouton de notes s'efface pour ne rien couvrir (« Sauvegarder » est en bas a droite).
  var observateur = null;
  function suivreFenetres(doc) {
    if (observateur) observateur.disconnect();
    var maj = function () { $('notes').classList.toggle('discret', doc.body.classList.contains('modal-open')); };
    observateur = new MutationObserver(maj);
    observateur.observe(doc.body, { attributes: true, attributeFilter: ['class'] });
    maj();
  }
  $('vue').addEventListener('load', function () {
    try { suivreFenetres(this.contentDocument); } catch (e) { /* autre origine */ }
    try {
      var m = /\/variante-13\/(notifications|profil-([ABC]))\.html$/.exec(this.contentWindow.location.pathname);
      if (!m) return;
      var page = m[1] === 'notifications' ? 'notifications' : m[2];
      if (page !== etat.page) {
        etat.page = page;
        history.replaceState(null, '', '#p13/' + page);
        document.title = (page === 'notifications' ? 'Notifications' : nomPage(page)) + ' · Yukta\'s final prototype';
        majContexte();
      }
    } catch (e) { /* page d'une autre origine : rien a synchroniser */ }
  });

  $('reinitialiser').addEventListener('click', function () {
    var n = 0;
    try {
      Object.keys(localStorage).forEach(function (k) {
        if (k.indexOf('ia-demo:') === 0) { localStorage.removeItem(k); n++; }
      });
    } catch (e) { /* stockage indisponible */ }
    toast(n ? 'Démo réinitialisée : le prototype repart de zéro.' : 'Rien à réinitialiser.');
    $('vue').contentWindow.location.reload();
  });

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  // ── Notes de revue ─────────────────────────────────────────────────────
  // Un commentaire general (un seul, en haut) et des remarques rattachees au
  // prototype ouvert au moment ou elles sont ecrites. Enregistres sur le serveur
  // (outils/serveur.py : tout le monde voit les memes) ; sinon dans ce navigateur.
  var CLE_LOCALE = 'revue:notes', CLE_GENERAL = 'revue:general', CLE_OUVERT = 'revue:notes-ouvert';
  var notes = [], general = { text: '', at: null }, serveur = null, enEdition = null, filtre = 'courant', minuterieGeneral = null;
  function lsLire(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
  function lsEcrire(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }

  function api(methode, chemin, corps) {
    return fetch(chemin, { method: methode, headers: corps ? { 'Content-Type': 'application/json' } : {}, body: corps ? JSON.stringify(corps) : undefined, credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function charger() {
    return Promise.all([api('GET', 'api/notes'), api('GET', 'api/general')]).then(function (r) {
      serveur = true; notes = r[0]; general = r[1];
    }, function () {
      serveur = false; notes = lsLire(CLE_LOCALE, []); general = lsLire(CLE_GENERAL, { text: '', at: null });
    }).then(function () {
      // Ne pas ecraser ce que la personne est en train de taper.
      dessinerNotes();
    });
  }

  // Le prototype ouvert : numero + nom (ce qui est enregistre avec la remarque).
  function protoCourant() {
    if (!etat.proto) return null;
    var n = etat.proto;
    var info = n === 'base' ? ORIGINE : P[n];
    return { id: String(n), num: n === 'base' ? '—' : n, nom: info.t, final: !!info.final,
      libelle: n === 'base' ? info.t : prefixe(n) + info.t };
  }
  function nomPage(id) { var pg = PAGES.filter(function (p) { return p.id === id; })[0]; return pg ? pg.t : ''; }
  function majContexte() {
    var z = $('notes-page');
    if (z) z.innerHTML = etat.page ? '<i class="fa fa-map-marker"></i> ' + esc(nomPage(etat.page)) : '';
    dessinerNotes();
  }
  function quand(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }
  function libelleNote(n) {
    if (String(n.proto) === '13') return nomPage(n.page) || 'Prototype';
    if (n.proto && (n.proto === 'base' || P[n.proto])) {
      var info = n.proto === 'base' ? ORIGINE : P[n.proto];
      return (n.proto === 'base' || info.final ? info.t : prefixe(n.proto) + info.t);
    }
    return n.context || 'Sans prototype';
  }
  function dessinerNotes() {
    var total = notes.length + (general.text ? 1 : 0);
    $('notes-compte').textContent = total;
    var visibles = notes.slice();
    // Un ancien « commentaire general » reste visible, en tete de liste.
    if (general.text) visibles.push({ id: '__general', text: general.text, at: general.at, general: true });
    var l = $('notes-liste');
    if (!visibles.length) {
      l.innerHTML = '<div class="notes-vide">Aucun commentaire pour l’instant.</div>';
      return;
    }
    l.innerHTML = visibles.slice().reverse().map(function (n) {
      var edite = enEdition === n.id;
      return '<div class="note" data-id="' + esc(n.id) + '"><div class="note-meta"><span class="ctx">' + esc(n.general ? 'Général' : libelleNote(n)) + '</span>' +
        '<span>' + esc(quand(n.at)) + (n.edited ? ' · modifié' : '') + '</span><span class="sep"></span>' +
        (edite || n.general ? '' : '<button type="button" data-a="editer" title="Modifier"><i class="fa fa-pencil"></i></button><button type="button" data-a="suppr" title="Supprimer"><i class="fa fa-trash-o"></i></button>') +
        '</div>' + (edite ? '<textarea maxlength="5000">' + esc(n.text) + '</textarea><div class="actions"><button type="button" data-a="annuler">Annuler</button>' +
        '<button type="button" class="ok" data-a="enregistrer">Enregistrer</button></div>' : '<div class="note-texte">' + esc(n.text) + '</div>') + '</div>';
    }).join('');
    var z = l.querySelector('textarea');
    if (z) { z.focus(); z.setSelectionRange(z.value.length, z.value.length); }
  }

  function enregistrerGeneral() { /* plus de saisie separee : le commentaire general existant reste lisible et exporte */ }

  function ajouter() {
    var c = protoCourant();
    var texte = $('notes-texte').value.trim();
    if (!texte || !c) return;
    var note = { text: texte, proto: c.id, page: etat.page, context: c.libelle + ' · ' + nomPage(etat.page) };
    $('notes-ajouter').disabled = true;
    var fin = function () { $('notes-texte').value = ''; $('notes-texte').focus(); dessinerNotes(); };
    if (serveur) {
      api('POST', 'api/notes', note).then(function (n) { notes.push(n); fin(); },
        function () { $('notes-ajouter').disabled = false; toast('La remarque n’a pas pu être enregistrée : réessayez.'); });
    } else {
      note.id = Date.now().toString(36); note.at = new Date().toISOString(); note.edited = null;
      notes.push(note); lsEcrire(CLE_LOCALE, notes); fin();
    }
  }
  $('notes-texte').addEventListener('input', function () { $('notes-ajouter').disabled = !this.value.trim(); });
  $('notes-texte').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ajouter(); } });
  $('notes-ajouter').addEventListener('click', ajouter);

  $('notes-liste').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]');
    if (!b) return;
    var id = b.closest('.note').getAttribute('data-id');
    var n = notes.filter(function (x) { return x.id === id; })[0];
    var a = b.getAttribute('data-a');
    if (a === 'editer') { enEdition = id; dessinerNotes(); }
    else if (a === 'annuler') { enEdition = null; dessinerNotes(); }
    else if (a === 'enregistrer') {
      var t = b.closest('.note').querySelector('textarea').value.trim();
      if (!t) return;
      if (serveur) api('PUT', 'api/notes/' + encodeURIComponent(id), { text: t }).then(function (m) { Object.assign(n, m); enEdition = null; dessinerNotes(); },
        function () { toast('La modification n’a pas pu être enregistrée.'); });
      else { n.text = t; n.edited = new Date().toISOString(); lsEcrire(CLE_LOCALE, notes); enEdition = null; dessinerNotes(); }
    } else if (a === 'suppr') {
      if (!confirm('Supprimer cette remarque ?')) return;
      var retirer = function () { notes = notes.filter(function (x) { return x.id !== id; }); if (!serveur) lsEcrire(CLE_LOCALE, notes); dessinerNotes(); };
      if (serveur) api('DELETE', 'api/notes/' + encodeURIComponent(id)).then(retirer, function () { toast('La remarque n’a pas pu être supprimée.'); });
      else retirer();
    }
  });

  // Export : la liste des commentaires, chacun avec sa page.
  function enTexte() {
    var lignes = ['# Commentaires — Yukta\'s final prototype', '', 'Exporté le ' + quand(new Date().toISOString()), ''];
    if (general.text) lignes.push('## Général', '', general.text.trim(), '');
    if (!notes.length) lignes.push('_(aucun commentaire)_', '');
    notes.forEach(function (n) {
      lignes.push('- **' + libelleNote(n) + '** · ' + quand(n.at) + '  ', '  ' + n.text.replace(/\n/g, '\n  '));
    });
    return lignes.join('\n');
  }
  function copierTexte(texte) {
    // Presse-papiers moderne, sinon l'ancienne methode (fonctionne aussi hors HTTPS).
    function secours() {
      var z = document.createElement('textarea');
      z.value = texte;
      z.setAttribute('readonly', '');
      z.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(z);
      z.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      z.remove();
      return ok ? Promise.resolve() : Promise.reject();
    }
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texte).catch(secours);
    return secours();
  }
  $('notes-copier').addEventListener('click', function () {
    enregistrerGeneral();
    copierTexte(enTexte()).then(function () { toast('Tout est copié : collez-le où vous voulez.'); },
      function () { toast('Copie impossible dans ce navigateur : utilisez « Télécharger ».'); });
  });
  $('notes-telecharger').addEventListener('click', function () {
    enregistrerGeneral();
    var url = URL.createObjectURL(new Blob(['\ufeff' + enTexte()], { type: 'text/markdown;charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'commentaires-prototype.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast('Fichier téléchargé : commentaires-prototype.md');
  });
  function ouvrirNotes(oui) {
    $('notes-panneau').hidden = !oui;
    $('notes-ouvrir').hidden = oui;
    $('notes-ouvrir').setAttribute('aria-expanded', oui);
    lsEcrire(CLE_OUVERT, oui);
    if (oui) { charger(); setTimeout(function () { $('notes-texte').focus(); }, 0); }
  }
  $('notes-ouvrir').addEventListener('click', function () { ouvrirNotes(true); });
  $('notes-fermer').addEventListener('click', function () { enregistrerGeneral(); ouvrirNotes(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('notes-panneau').hidden && !enEdition) { enregistrerGeneral(); ouvrirNotes(false); } });
  // Les notes des autres relecteurs apparaissent pendant que la fenetre est ouverte.
  setInterval(function () { if (!$('notes-panneau').hidden && serveur && !enEdition && !$('notes-texte').value) charger(); }, 20000);

  charger();
  lireHash();
  if (lsLire(CLE_OUVERT, false)) ouvrirNotes(true);
})();
</script>
</body>
</html>
